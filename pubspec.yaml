name: dailyhabittracker
description: "Daily Habit Tracker: create habits, earn points, and follow 7-day streaks. Flutter, clean architecture, Firebase Firestore."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  flutter_bloc: ^9.1.1
  go_router: ^18.1.0
  get_it: ^9.3.0

  # Domain modelling & functional error handling
  freezed_annotation: ^3.1.0
  fpdart: ^1.2.0

  # Backend
  firebase_core: ^5.0.0
  cloud_firestore: ^7.0.0

  # UI
  material_symbols_icons: ^4.2960.0
  shimmer: ^4.0.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.16.1
  freezed: ^4.0.1

  # Testing
  mocktail: ^1.0.5

  # Tooling
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0C3D1A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
